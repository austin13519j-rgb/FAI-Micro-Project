services:
  - type: web
    name: ot-turnaround-planner-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
        # Example: postgresql://neondb_owner:YOUR_PASSWORD@ep-sample-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: FRONTEND_ORIGIN
        sync: false
        # Example: https://ot-turnaround-planner.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.9

